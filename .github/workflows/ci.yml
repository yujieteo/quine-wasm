name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Install
        run: nix develop -c npm ci
      - name: Build the SQLite demo, its IDBFS control and the test program
        run: nix develop -c sh -c 'sh examples/sqlite/build.sh && sh tests/build.sh'
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Test in Chromium, Firefox and WebKit
        run: npx playwright test --reporter list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlite-demo-and-results
          path: |
            build/sqlite.html
            test-results/
