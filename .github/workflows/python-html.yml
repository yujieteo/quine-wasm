name: python-html
on:
  push:
    branches: [main]
    paths:
      - 'examples/python-html/**'
      - '.github/workflows/python-html.yml'
  pull_request:
    paths:
      - 'examples/python-html/**'
      - '.github/workflows/python-html.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python-html
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Install
        run: nix develop -c npm ci
      - name: Build python.html and python-sci.html
        run: nix develop -c bash scripts/build.sh
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Test in Chromium, Firefox and WebKit
        run: npx playwright test --reporter list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-and-results
          path: |
            examples/python-html/build/python.html
            examples/python-html/build/python-sci.html
            examples/python-html/test-results/
